name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff

      # Databricks notebooks are valid Python files with magic comments,
      # so a syntax check catches broken code before it reaches a job run.
      - name: Syntax check
        run: python -m compileall -q python notebooks

      - name: Lint
        run: ruff check python notebooks --ignore E402,F821

      # SQL files are deliverables; this guards against empty or missing ones.
      - name: Verify SQL deliverables exist
        run: |
          for f in sql/01_catalog_setup.sql sql/02_tables.sql sql/03_grants.sql sql/04_show_grants.sql; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          echo "All SQL deliverables present"